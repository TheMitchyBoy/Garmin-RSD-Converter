# Railway deployment config — https://docs.railway.app/guides/config-as-code
#
# After deploy: attach a volume mounted at /data so uploads survive restarts.
# Recommended plan memory: 2 GB minimum (PINGVerter + numpy/pandas).

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Used when Railway builds with Railpack/Nixpacks instead of Docker.
# main.py is also detected automatically; this is an explicit fallback.
startCommand = "python sonar_upload_server.py --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
numReplicas = 1
